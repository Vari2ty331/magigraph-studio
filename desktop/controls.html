<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'"><title>따라 그리기 조작 패널</title><link rel="stylesheet" href="controls.css"></head><body><header>따라 그리기 <span>끌어 이동</span><button id="close" aria-label="조작 패널 숨기기" title="조작 패널 숨기기">×</button></header><p id="selection" aria-live="polite">선택한 획 없음</p><nav><button id="prev">← 이전 획</button><button id="next">다음 획 →</button><button id="full" aria-pressed="false">전체 도안</button><button id="visibility">오버레이 표시</button><button id="align" aria-pressed="false">위치 맞추기</button></nav><section class="placement" hidden><label for="xNumber">창 X</label><input id="xNumber" type="number" min="-30000" max="30000" step="1" value="100"><input id="xSlider" type="range" min="-1920" max="3840" step="1" value="100" aria-label="창 X 위치"><label for="yNumber">창 Y</label><input id="yNumber" type="number" min="-30000" max="30000" step="1" value="100"><input id="ySlider" type="range" min="-1920" max="3840" step="1" value="100" aria-label="창 Y 위치"><label for="radiusNumber">원 반지름 (px)</label><input id="radiusNumber" type="number" min="50" max="1500" step="0.5" value="200"><label for="opacitySlider">불투명도</label><output id="opacityValue" for="opacitySlider">80%</output><input id="opacitySlider" type="range" min="0.1" max="1" step="0.05" value="0.8" aria-label="오버레이 불투명도"></section><script src="controls.js"></script></body></html>
